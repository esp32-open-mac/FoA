[workspace]
resolver = "3"
members = ["foa", "foa_sta", "foa_awdl", "examples"]

[workspace.dependencies]
esp-hal = "=1.1.2"
esp-config = "0.7.0"

portable-atomic = { version = "1.15.0", default-features = false }

embassy-futures = "0.1.2"
embassy-net-driver-channel = "0.4.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"


defmt-or-log = { version = "0.2.3", default-features = false }
defmt = { version = "1.1.1" }
log = { version = "0.4.33" }

futures-util = { version = "0.3.34", default-features = false }
heapless = { version = "0.9.3", features = ["defmt"] }

ieee80211 = "0.5.9"
llc-rs = "0.1.3"
ethernet = { version = "0.1.6", default-features = false }
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[patch.crates-io]
# esp-wifi-hal with ESP32-C3 support (esp32-open-mac/esp-wifi-hal pull request) and the esp32c3
# PAC with the Wi-Fi MAC register block (esp-rs/esp-pacs#510, rebased onto the 0.32.3 release).
esp-wifi-hal = { git = "https://github.com/okhsunrog/esp-wifi-hal.git", rev = "e65264ae992a02a4d776b33ad3e3784cf8f33260" }
esp32c3 = { git = "https://github.com/okhsunrog/esp-pacs.git", rev = "9be190016260ef195c97f7aa5aa7c576a1646890" }
